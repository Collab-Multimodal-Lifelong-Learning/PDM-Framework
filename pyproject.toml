[project]
name = "pdm-framework"
version = "0.1.0"
description = "Continual learning for a multimodal browser agent"
requires-python = ">=3.11,<3.12"
dependencies = ["pillow>=10,<14", "numpy>=1.26,<3", "safetensors>=0.5,<0.8"]

[project.optional-dependencies]
cpu = ["torch==2.7.1"]
gpu = ["torch==2.7.1", "torchvision==0.22.1", "transformers==4.52.4", "peft==0.15.2", "accelerate==1.7.0"]

[project.scripts]
pdm-agent = "pdm.web:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pdm"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu128", extra = "gpu" }]
torchvision = { index = "pytorch-cu128", extra = "gpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
